name: Release Turtleneck

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: turtleneck-macos-arm64
          - os: windows-latest
            artifact: turtleneck-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build unsigned bundle
        shell: bash
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller packaging/turtleneck.spec --noconfirm --clean
      - name: Refuse unsigned public release
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            for value in "$APPLE_CERTIFICATE_BASE64" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY" "$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_PASSWORD"; do
              if [[ -z "$value" ]]; then
                echo 'Missing Apple signing or notarization secret; refusing unsigned release.' >&2
                exit 1
              fi
            done
          else
            for value in "$WINDOWS_PFX_BASE64" "$WINDOWS_PFX_PASSWORD"; do
              if [[ -z "$value" ]]; then
                echo 'Missing Windows signing secret; refusing unsigned release.' >&2
                exit 1
              fi
            done
          fi
      - name: Sign macOS bundle
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          CERTIFICATE="$RUNNER_TEMP/turtleneck.p12"
          KEYCHAIN="$RUNNER_TEMP/turtleneck.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" dist/turtleneck/turtleneck
          codesign --verify --deep --strict dist/turtleneck/turtleneck
          ditto -c -k --keepParent dist/turtleneck "$RUNNER_TEMP/turtleneck.zip"
          xcrun notarytool submit "$RUNNER_TEMP/turtleneck.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
      - name: Sign Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'turtleneck.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem ${env:ProgramFiles(x86)}\Windows Kits -Filter signtool.exe -Recurse | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          $arguments = @('sign', '/fd', 'SHA256', '/f', $pfx, '/p', $env:PFX_PASSWORD)
          if ($env:TIMESTAMP_URL) { $arguments += @('/tr', $env:TIMESTAMP_URL, '/td', 'SHA256') }
          $arguments += 'dist\turtleneck\turtleneck.exe'
          & $signtool.FullName @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
      - name: Package and checksum
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          artifact = os.environ['ARTIFACT']
          output = Path(f'{artifact}.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as bundle:
              for path in Path('dist/turtleneck').rglob('*'):
                  if path.is_file():
                      bundle.write(path, path.as_posix())
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path(f'{artifact}.sha256').write_text(f'{digest}  {output.name}\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: turtleneck-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
