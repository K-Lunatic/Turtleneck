name: Release Turtleneck

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag to update
        required: true
        default: v0.6.5
      publish:
        description: Publish the generated artifacts as a GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: turtleneck-macos-x64-unsigned
          - os: macos-15
            artifact: turtleneck-macos-arm64-unsigned
          - os: windows-latest
            artifact: turtleneck-windows-x64-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release version
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        shell: bash
        env:
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          expected="${EXPECTED_TAG#v}"
          actual="$(python -c 'import json; print(json.load(open("plugin.json", encoding="utf-8"))["version"])')"
          test "$actual" = "$expected"
      - name: Build unsigned bundle
        shell: bash
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m pip install -r packaging/desktop-requirements.txt
          pyinstaller packaging/turtleneck.spec --noconfirm --clean
          if [[ "$RUNNER_OS" == "macOS" || "$RUNNER_OS" == "Windows" ]]; then
            pyinstaller packaging/companion.spec --noconfirm --clean \
              --distpath dist/companion --workpath build/companion
          fi
      - name: Smoke test bundled runtime
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            env -i HOME="${HOME:-}" USERPROFILE="${USERPROFILE:-}" SYSTEMROOT="${SYSTEMROOT:-}" WINDIR="${WINDIR:-}" TEMP="${TEMP:-}" TMP="${TMP:-}" PATH=/usr/bin:/bin:/c/Windows/System32 dist/turtleneck/turtleneck.exe --version
            env -i HOME="${HOME:-}" USERPROFILE="${USERPROFILE:-}" SYSTEMROOT="${SYSTEMROOT:-}" WINDIR="${WINDIR:-}" TEMP="${TEMP:-}" TMP="${TMP:-}" PATH=/usr/bin:/bin:/c/Windows/System32 dist/turtleneck/turtleneck.exe --help > cli-help.txt
            test -f "dist/companion/turtleneck-companion.exe"
            env -i HOME="${HOME:-}" USERPROFILE="${USERPROFILE:-}" SYSTEMROOT="${SYSTEMROOT:-}" WINDIR="${WINDIR:-}" TEMP="${TEMP:-}" TMP="${TMP:-}" PATH=/usr/bin:/bin:/c/Windows/System32 dist/companion/turtleneck-companion.exe --status > companion-status.json
          else
            env -i HOME="${HOME:-}" USERPROFILE="${USERPROFILE:-}" SYSTEMROOT="${SYSTEMROOT:-}" WINDIR="${WINDIR:-}" TEMP="${TEMP:-}" TMP="${TMP:-}" PATH=/usr/bin:/bin dist/turtleneck/turtleneck --version
            env -i HOME="${HOME:-}" USERPROFILE="${USERPROFILE:-}" SYSTEMROOT="${SYSTEMROOT:-}" WINDIR="${WINDIR:-}" TEMP="${TEMP:-}" TMP="${TMP:-}" PATH=/usr/bin:/bin dist/turtleneck/turtleneck --help > cli-help.txt
            test -d "dist/companion/Turtleneck Companion.app"
            env -i HOME="${HOME:-}" USERPROFILE="${USERPROFILE:-}" SYSTEMROOT="${SYSTEMROOT:-}" WINDIR="${WINDIR:-}" TEMP="${TEMP:-}" TMP="${TMP:-}" PATH=/usr/bin:/bin "dist/companion/Turtleneck Companion.app/Contents/MacOS/turtleneck-companion" --status > companion-status.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          assert Path('cli-help.txt').read_text(encoding='utf-8').strip()
          status = json.loads(Path('companion-status.json').read_text(encoding='utf-8'))
          rendered = json.dumps(status, ensure_ascii=False).lower()
          for secret_marker in ('password', 'cookie', 'session', 'token'):
              assert secret_marker not in rendered, secret_marker
          assert 'skill' in status and 'profiles' in status
          PY
      - name: Package and checksum
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          artifact = os.environ['ARTIFACT']
          output = Path(f'{artifact}.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as bundle:
              for path in Path('dist/turtleneck').rglob('*'):
                  if path.is_file():
                      bundle.write(path, path.as_posix())
          with zipfile.ZipFile(output) as bundle:
              names = set(bundle.namelist())
              assert 'dist/turtleneck/assets/turtleneck.png' in names
              assert any(name.endswith('skills/university-agent/assets/turtleneck.png') for name in names)
              assert not any(name.endswith(('.env', '.db')) for name in names)
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path(f'{artifact}.sha256').write_text(f'{digest}  {output.name}\n', encoding='utf-8')
          if os.environ.get('RUNNER_OS') in {'macOS', 'Windows'}:
              companion = (Path('dist/companion/Turtleneck Companion.app')
                           if os.environ['RUNNER_OS'] == 'macOS'
                           else Path('dist/companion'))
              companion_output = Path(f'{artifact}-companion.zip')
              with zipfile.ZipFile(companion_output, 'w', zipfile.ZIP_DEFLATED) as bundle:
                  for path in companion.rglob('*'):
                      if path.is_file():
                          bundle.write(path, path.as_posix())
              companion_digest = hashlib.sha256(companion_output.read_bytes()).hexdigest()
              Path(f'{artifact}-companion.sha256').write_text(
                  f'{companion_digest}  {companion_output.name}\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.sha256
            ${{ matrix.artifact }}-companion.zip
            ${{ matrix.artifact }}-companion.sha256
          if-no-files-found: ignore

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Validate release metadata
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        shell: bash
        env:
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          expected="${EXPECTED_TAG#v}"
          actual="$(python -c 'import json; print(json.load(open("plugin.json", encoding="utf-8"))["version"])')"
          test "$actual" = "$expected"
      - name: Package verified source update
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          tag = os.environ.get('GITHUB_REF_NAME', 'source')
          root_name = f'Turtleneck-{tag}'
          output = Path('turtleneck-source.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as bundle:
              for base in (Path('skills/university-agent'), Path('plugin.json'), Path('.claude-plugin')):
                  if base.is_file():
                      bundle.write(base, f'{root_name}/{base.as_posix()}')
                  elif base.is_dir():
                      for path in base.rglob('*'):
                          if path.is_file():
                              bundle.write(path, f'{root_name}/{path.as_posix()}')
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path('turtleneck-source.sha256').write_text(f'{digest}  {output.name}\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: turtleneck-source
          path: |
            turtleneck-source.zip
            turtleneck-source.sha256

  publish:
    needs: [build, source]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: turtleneck-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: false
          body: |
            This release contains unsigned desktop bundles.

            macOS may show a Gatekeeper warning and Windows may show a SmartScreen warning.
            Verify the SHA-256 checksums before extracting and run only from a trusted copy of this repository.
          files: release/*
