name: Release Turtleneck

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: turtleneck-macos-arm64-unsigned
          - os: windows-latest
            artifact: turtleneck-windows-x64-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build unsigned bundle
        shell: bash
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller packaging/turtleneck.spec --noconfirm --clean
      - name: Package and checksum
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          artifact = os.environ['ARTIFACT']
          output = Path(f'{artifact}.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as bundle:
              for path in Path('dist/turtleneck').rglob('*'):
                  if path.is_file():
                      bundle.write(path, path.as_posix())
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path(f'{artifact}.sha256').write_text(f'{digest}  {output.name}\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: turtleneck-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            This release contains unsigned desktop bundles.

            macOS may show a Gatekeeper warning and Windows may show a SmartScreen warning.
            Verify the SHA-256 checksums before extracting and run only from a trusted copy of this repository.
          files: release/*
