name: Test Turtleneck

on:
  push:
    branches: [turtleneck, dev]
  pull_request:

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        shell: bash
        run: |
          PYTHONPATH=skills/university-agent python -m unittest discover -s skills/university-agent/tests -p 'test_*.py'
          PYTHONPATH=skills/university-agent python -m unittest server.test_app server.test_local
          python -m compileall -q server skills/university-agent packaging
      - name: Validate standalone build
        shell: bash
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller packaging/turtleneck.spec --noconfirm --clean
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dist/turtleneck/turtleneck.exe --version
          else
            dist/turtleneck/turtleneck --version
          fi
