name: Test Turtleneck

on:
  push:
    branches: [turtleneck]
  pull_request:

permissions:
  contents: read

concurrency:
  group: turtleneck-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.suite }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
        suite: [study-core, study-web, study-media, study-materials, study-pipeline, study-main, sync, assignments, moodle]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: matrix.suite == 'assignments'
        with:
          node-version: '22'
      - name: Run skill tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PYTHONPATH="skills/university-agent;skills/university-agent/tests"
          else
            export PYTHONPATH="skills/university-agent:skills/university-agent/tests"
          fi
          case "${{ matrix.suite }}" in
            study-core)
              modules="test_concept_insights test_learning_plan test_study_pack test_study_topup test_language"
              ;;
            study-web)
              modules="test_exam_web"
              ;;
            study-media)
              modules="test_lecture_audio"
              ;;
            study-materials)
              modules="test_study_materials"
              ;;
            study-pipeline)
              modules="test_study_pipeline"
              ;;
            study-main)
              modules="test_study"
              ;;
            sync)
              modules="test_academic_alerts test_academic_status test_analysis_records test_connection test_everytime_connect test_setup test_sync_policy test_sync_safety test_tls_backup_download test_tls_data test_tls_login test_tls_optimization test_update"
              ;;
            assignments)
              modules="test_assignment_draft test_assignment_selection test_assignment_submission test_learner_profile test_notice_storage_optimization test_project test_resource_responses test_resource_targeting test_secret_boundary test_source_library test_gradkuya test_presentation test_companion test_private_files test_profile_accounts"
              ;;
            moodle)
              modules="test_assemble_moodle_backup test_autonomous_course_policy test_autonomous_course_watch test_autonomous_courses test_control_tls_activities test_control_tls_quiz_questions test_document_export test_inspect_tls_activity_forms test_install_turtleneck test_moodle_xml test_rebuild_moodle_backup test_restore_moodle_backup test_update_autonomous_course test_update_autonomous_section test_validate_moodle_backup test_canvas_provider test_moodle_migration test_moodle_portability test_moodle_site_modules test_moodle_teaching"
              ;;
          esac
          python -m unittest $modules

  server:
    name: server (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run gateway tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PYTHONPATH="skills/university-agent;skills/university-agent/tests;."
          else
            export PYTHONPATH="skills/university-agent:skills/university-agent/tests:."
          fi
          python -m unittest server.test_app server.test_local

  standalone:
    name: standalone (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile sources
        shell: bash
        run: python -m compileall -q server skills/university-agent packaging
      - name: Validate standalone build
        shell: bash
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m pip install -r packaging/desktop-requirements.txt
          pyinstaller packaging/turtleneck.spec --noconfirm --clean
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            env -i PATH=/usr/bin:/bin:/c/Windows/System32 dist/turtleneck/turtleneck.exe --version
            env -i PATH=/usr/bin:/bin:/c/Windows/System32 dist/turtleneck/turtleneck.exe --help > cli-help.txt
            pyinstaller packaging/companion.spec --noconfirm --clean \
              --distpath dist/companion --workpath build/companion
            test -f "dist/companion/turtleneck-companion.exe"
            env -i PATH=/usr/bin:/bin:/c/Windows/System32 dist/companion/turtleneck-companion.exe --status > companion-status.json
          else
            env -i PATH=/usr/bin:/bin dist/turtleneck/turtleneck --version
            env -i PATH=/usr/bin:/bin dist/turtleneck/turtleneck --help > cli-help.txt
            pyinstaller packaging/companion.spec --noconfirm --clean \
              --distpath dist/companion --workpath build/companion
            test -d "dist/companion/Turtleneck Companion.app"
            env -i PATH=/usr/bin:/bin "dist/companion/Turtleneck Companion.app/Contents/MacOS/turtleneck-companion" --status > companion-status.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          assert Path("cli-help.txt").read_text(encoding="utf-8").strip()
          status = json.loads(Path("companion-status.json").read_text(encoding="utf-8"))
          rendered = json.dumps(status, ensure_ascii=False).lower()
          for secret_marker in ("password", "cookie", "session", "token"):
              assert secret_marker not in rendered, secret_marker
          assert "skill" in status and "profiles" in status
          PY

  rust-core:
    name: rust-core (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and test Rust core
        shell: bash
        run: |
          cargo build --release --locked --manifest-path experiments/rust-core/Cargo.toml
          cargo test --release --locked --manifest-path experiments/rust-core/Cargo.toml
          python -m unittest discover -s experiments/rust-core -p 'test_*.py'
